<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#081024" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .wire-pulse {
      stroke-dasharray: 8 16;
      animation: dash 12s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    .node-float {
      animation: floatSlow 5s ease-in-out infinite;
    }
    .orb-anim {
      transform-origin: center;
      animation: pulseOrb 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Background Orbs (Kept behind) -->
  <g class="orb-anim" opacity="0.4">
    <circle cx="150" cy="100" r="130" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="1050" cy="300" r="160" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="600" cy="40" r="90" fill="#3b82f6" filter="url(#glow)" />
  </g>

  <!-- Geometric Grid Pattern Lines (Background depth) -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.3">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Animated IoT Mesh & Data Paths (Behind Text) -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.5" class="wire-pulse">
    <path d="M 120 330 Q 350 290, 600 340 T 1080 320" />
    <path d="M 80 90 Q 400 130, 800 80 T 1140 120" stroke="#a855f7" />
  </g>

  <!-- Interactive Floating IoT Architecture Nodes (Subtle decorative background edges) -->
  <g class="node-float" opacity="0.85">
    <!-- Edge Gateway Node -->
    <g transform="translate(60, 240)">
      <rect width="110" height="52" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="20" cy="26" r="6" fill="#06b6d4" filter="url(#softGlow)" />
      <text x="35" y="24" fill="#f1f5f9" font-family="system-ui" font-size="12" font-weight="700">Edge Gateway</text>
      <text x="35" y="38" fill="#64748b" font-family="system-ui" font-size="10">Modbus / OPC</text>
    </g>

    <!-- MQTT Broker Node -->
    <g transform="translate(1020, 180)">
      <rect width="120" height="52" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="20" cy="26" r="6" fill="#3b82f6" filter="url(#softGlow)" />
      <text x="35" y="24" fill="#f1f5f9" font-family="system-ui" font-size="12" font-weight="700">MQTT Cluster</text>
      <text x="35" y="38" fill="#64748b" font-family="system-ui" font-size="10">v5.0 / Distributed</text>
    </g>

    <!-- Time Series TSDB Node -->
    <g transform="translate(1000, 70)">
      <rect width="130" height="52" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2" />
      <circle cx="20" cy="26" r="6" fill="#8b5cf6" filter="url(#softGlow)" />
      <text x="35" y="24" fill="#f1f5f9" font-family="system-ui" font-size="12" font-weight="700">Telemetry TSDB</text>
      <text x="35" y="38" fill="#64748b" font-family="system-ui" font-size="10">Real-Time Ingestion</text>
    </g>
  </g>

  <!-- Central Foreground Shield / Content (Clear foreground readability) -->
  <g transform="translate(0, 0)">
    <!-- Main Gradient Header Text -->
    <text x="600" y="145" text-anchor="middle" class="title-text">
      Awesome Internet of Things (IoT) Platforms
    </text>

    <!-- Subtitle Text -->
    <text x="600" y="190" text-anchor="middle" class="subtitle-text">
      Curated Landscape of Cloud SaaS Suites &amp; Sovereign Open-Source Stacks
    </text>

    <!-- Technology Category Feature Pills (Foreground) -->
    <g transform="translate(195, 240)">
      <!-- Pill 1: MQTT & Brokers -->
      <g transform="translate(0, 0)">
        <rect width="145" height="38" rx="19" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
        <circle cx="22" cy="19" r="5" fill="#06b6d4" filter="url(#softGlow)" />
        <text x="38" y="24" class="badge-text">MQTT 5.0 Brokers</text>
      </g>

      <!-- Pill 2: Industrial IIoT & Edge -->
      <g transform="translate(160, 0)">
        <rect width="165" height="38" rx="19" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
        <circle cx="22" cy="19" r="5" fill="#3b82f6" filter="url(#softGlow)" />
        <text x="38" y="24" class="badge-text">Industrial Edge &amp; OT</text>
      </g>

      <!-- Pill 3: Digital Twins -->
      <g transform="translate(340, 0)">
        <rect width="145" height="38" rx="19" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
        <circle cx="22" cy="19" r="5" fill="#8b5cf6" filter="url(#softGlow)" />
        <text x="38" y="24" class="badge-text">Digital Twin APIs</text>
      </g>

      <!-- Pill 4: Telemetry & Ingestion -->
      <g transform="translate(500, 0)">
        <rect width="160" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
        <circle cx="22" cy="19" r="5" fill="#ec4899" filter="url(#softGlow)" />
        <text x="38" y="24" class="badge-text">Time-Series TSDB</text>
      </g>

      <!-- Pill 5: Fleet & OTA -->
      <g transform="translate(675, 0)">
        <rect width="135" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <circle cx="22" cy="19" r="5" fill="#10b981" filter="url(#softGlow)" />
        <text x="38" y="24" class="badge-text">OTA Firmware</text>
      </g>
    </g>

    <!-- Bottom Highlights / Tagline -->
    <text x="600" y="340" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="500" fill="#64748b" letter-spacing="1.5">
      DEVICE MANAGEMENT • BIDIRECTIONAL MESSAGING • INDUSTRIAL AUTOMATION • REAL-TIME TELEMETRY
    </text>
  </g>
</svg>
